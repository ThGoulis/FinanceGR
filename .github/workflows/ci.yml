name: FinanceGR CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  integrity-and-unit-tests:
    name: Static Gate & Unit Tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Static Integrity, Syntax & Security Audit
        run: npm run check

      - name: Run All Unit Test Suites (Frontend + Worker + Functions)
        run: npm test

  e2e-smoke:
    name: Playwright Browser Smoke Tests
    runs-on: ubuntu-latest
    needs: integrity-and-unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright & Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Smoke Suite
        run: npm run test:e2e
